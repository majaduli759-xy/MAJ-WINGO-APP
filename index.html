<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAJ WINGO STATS</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:linear-gradient(140deg,#07152f,#241044);
 color:white;font-family:Arial,sans-serif;
}
.container{max-width:480px;margin:auto}
h1{text-align:center;color:#65baff}
h1 span{color:#ff72c9}
.card{
 background:#18264b;padding:18px;
 border:1px solid #5365a5;
 border-radius:16px;margin:16px 0;
}
button,select{
 padding:12px;border:0;border-radius:9px;
 margin:5px;font-weight:bold;
}
button{background:#ff72c9;color:#17112b}
select{background:#65baff;color:#07152f}
.stats{display:flex;justify-content:space-around;text-align:center}
.number{font-size:25px;color:#65baff}
#history div{padding:10px;border-bottom:1px solid #5365a5}
</style>
</head>
<body>
<div class="container">
<h1>MAJ <span>WINGO</span> STATS</h1>

<div class="card">
<h3>Result Statistics</h3>
<div class="stats">
<div>RED<div class="number" id="red">0</div></div>
<div>GREEN<div class="number" id="green">0</div></div>
<div>VIOLET<div class="number" id="violet">0</div></div>
</div>
</div>

<div class="card">
<h3>Add Previous Result</h3>
<select id="color">
<option value="Red">Red</option>
<option value="Green">Green</option>
<option value="Violet">Violet</option>
</select>
<select id="size">
<option value="Big">Big</option>
<option value="Small">Small</option>
</select>
<button onclick="addResult()">ADD RESULT</button>
</div>

<div class="card">
<h3>Result History</h3>
<div id="history">No results added</div>
<button onclick="clearHistory()">CLEAR HISTORY</button>
</div>
</div>

<script>
let results=[];

function addResult(){
 const color=document.getElementById('color').value;
 const size=document.getElementById('size').value;
 results.unshift({color,size});
 render();
}

function render(){
 ['Red','Green','Violet'].forEach(c=>{
 document.getElementById(c.toLowerCase()).textContent=
 results.filter(r=>r.color===c).length;
 });

 document.getElementById('history').innerHTML=
 results.map((r,i)=>
 `<div>${i+1}. ${r.color} — ${r.size}</div>`
 ).join('');
}

function clearHistory(){
 results=[];
 render();
}
</script>
</body>
</html>
